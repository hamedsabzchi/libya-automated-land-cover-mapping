# TEMPLATE ONLY. Put actual values in hosting secrets or .streamlit/secrets.toml.
# Never commit secrets.toml. See docs/website.md for the one-time owner setup.
[auth]
redirect_uri = "https://REPLACE_WITH_YOUR_SITE/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_SECRET"
client_id = "REPLACE_WITH_GOOGLE_WEB_OAUTH_CLIENT_ID"
client_secret = "REPLACE_WITH_GOOGLE_WEB_OAUTH_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
expose_tokens = ["access"]

[auth.client_kwargs]
scope = "openid profile email https://www.googleapis.com/auth/earthengine"
prompt = "select_account consent"
# Only a short-lived access token is used. No offline/refresh token is requested.
access_type = "online"
