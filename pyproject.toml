[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libya-landcover-assistant"
version = "0.4.0"
description = "Installable runner for the unchanged Libya GEE reference model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["earthengine-api==1.7.48"]

[project.scripts]
libya-landcover = "libya_landcover.cli:main"

[tool.setuptools.packages.find]
include = ["libya_landcover*", "python", "contracts"]

[tool.setuptools.package-data]
libya_landcover = ["gee_observer.js"]
