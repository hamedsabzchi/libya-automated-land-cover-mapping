[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "libya-landcover-assistant"
version = "0.8.0"
description = "Installable runner for the unchanged Libya GEE reference model"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["earthengine-api==1.7.48"]

[project.optional-dependencies]
chat = ["ipywidgets>=8.1,<9"]
map = ["ipywidgets>=8.1,<9", "ipyleaflet==0.20.0", "pyproj>=3.6,<4"]
map-chat = ["ipywidgets>=8.1,<9", "ipyleaflet==0.20.0", "pyproj>=3.6,<4", "transformers==4.57.6", "accelerate>=1.0,<2", "torch>=2.6,<3"]
local-chat = ["ipywidgets>=8.1,<9", "transformers==4.57.6", "accelerate>=1.0,<2", "torch>=2.6,<3"]

[project.scripts]
libya-landcover = "libya_landcover.cli:main"

[tool.setuptools.packages.find]
include = ["libya_landcover*", "python", "contracts"]

[tool.setuptools.package-data]
libya_landcover = ["gee_observer.js"]

