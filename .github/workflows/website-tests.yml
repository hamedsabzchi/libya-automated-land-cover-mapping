name: Separate website tests

on:
  push:
    branches: [main]
    paths: ['app.py', 'requirements.txt', 'website/**', 'python/landcover_engine.py', 'tests/test_website*', '.github/workflows/website-tests.yml']
  pull_request:
    paths: ['app.py', 'requirements.txt', 'website/**', 'python/landcover_engine.py', 'tests/test_website*', '.github/workflows/website-tests.yml']

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Offline per-user isolation and website UI checks
        run: python -m unittest discover -s tests -p 'test_website*.py' -v
