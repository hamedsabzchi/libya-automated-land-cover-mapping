name: Publish synchronized v1.0.3

on:
  push:
    paths:
      - '.github/workflows/publish-v103-sync.yml'

permissions:
  contents: write

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve expanded GEE app and repair synchronization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # --- GEE: preserve all user-added functionality; repair only regressions. ---
          js_path = Path('gee/automated_land_cover_app.js')
          js = js_path.read_text(encoding='utf-8')

          replacements = [
              (
                  '// By: Hamed Sabzchi Dehkharghani - FAO-NSL Geospatial Unit\n'
                  '// Geospatial Unit - Land and Water Division (NSL)\n'
                  '// Food and Agriculture Organization of the United Nations (FAO HQ)\n',
                  '// By: Hamed Sabzchi Dehkharghani\n'
                  '// Independent personal technical portfolio and research-development project.\n'
                  '// No institutional affiliation, sponsorship, approval, endorsement, or official status is claimed.\n'
              ),
              (
                  "control.add(note(\n"
                  "  'By: Hamed Sabzchi Dehkharghani - FAO-NSL Geospatial Unit; ' +\n"
                  "  'Food and Agriculture Organization of the United Nations'\n"
                  "));",
                  "control.add(note('By: Hamed Sabzchi Dehkharghani'));"
              ),
              ("var yearBox = input('Assessment / priority year', 2025);",
               "var yearBox = input('Assessment / priority year', 2024);"),
              ("var fallbackBox = input('Fallback year for the priority year', 2024);",
               "var fallbackBox = input('Fallback year for the priority year', 2023);"),
              ("'Assessment year', 2017, 2100", "'Assessment year', 2017, 2024"),
              ("'Fallback year', 2017, 2100", "'Fallback year', 2017, 2024"),
              ("FAO_LandCover_Exports", "LandCover_Exports"),
          ]

          for old, new in replacements:
              if old in js:
                  js = js.replace(old, new)

          required = [
              "// MATERIALIZE THE SELECTED RANDOM FOREST MODELS",
              "// DIRECT GEOTIFF DOWNLOADS FOR A PUBLISHED EARTH ENGINE APP",
              "// DYNAMIC NORTH ARROW AND SCALE BAR",
              "// SIMPLE ROWS / COLUMNS DOWNLOADS - FIXED 10 m PIXELS",
              "var yearBox = input('Assessment / priority year', 2024);",
              "var fallbackBox = input('Fallback year for the priority year', 2023);",
              "'Assessment year', 2017, 2024",
              "'Fallback year', 2017, 2024",
          ]
          for token in required:
              if token not in js:
                  raise SystemExit(f'Required GEE feature/setting missing: {token}')

          forbidden = [
              'FAO-NSL Geospatial Unit',
              'Food and Agriculture Organization of the United Nations',
              'FAO_LandCover_Exports',
              "'Assessment year', 2017, 2100",
              "'Fallback year', 2017, 2100",
          ]
          for token in forbidden:
              if token in js:
                  raise SystemExit(f'Unwanted regression remains in GEE source: {token}')

          # The public GEE UI intentionally keeps asset fields blank for portability.
          if "'Area of interest FeatureCollection asset',\n  ''" not in js:
              raise SystemExit('Public GEE AOI input is no longer blank as expected.')
          if "'Training points FeatureCollection asset',\n  ''" not in js:
              raise SystemExit('Public GEE training input is no longer blank as expected.')

          js_path.write_text(js, encoding='utf-8')

          # --- Python: scientific/modeling counterpart remains aligned; document JS-only features. ---
          py_path = Path('python/landcover_engine.py')
          py = py_path.read_text(encoding='utf-8')
          old_comment = (
              '# JavaScript-only UI, paged browser-download links, and map widgets are intentionally not duplicated.\n'
          )
          new_comment = (
              '# JavaScript-only UI, Random-Forest materialization for browser downloads, fixed-10 m\n'
              '# download-grid orchestration, paged links, north arrow, scale bar, and map widgets\n'
              '# are intentionally not duplicated in Python.\n'
          )
          if old_comment in py:
              py = py.replace(old_comment, new_comment, 1)
          py_path.write_text(py, encoding='utf-8')

          # --- Colab: make synchronization boundary explicit. ---
          nb_path = Path('python/02_landcover_colab.ipynb')
          nb = json.loads(nb_path.read_text(encoding='utf-8'))
          for cell in nb.get('cells', []):
              if cell.get('cell_type') != 'markdown':
                  continue
              src = ''.join(cell.get('source', []))
              if src.startswith('## GEE ↔ Python synchronization'):
                  text = (
                      '## GEE ↔ Python synchronization\n\n'
                      'This notebook uses the Python modeling core synchronized with the expanded Google Earth Engine application: '
                      'the same datasets, 2017–2024 bounds, 2024 target year, 2023 fallback, class-stratified 70/30 split, '
                      '500-tree Random Forest, 0.95 bag fraction, seed search, validation metrics, and cultivated-class temporal rules. '
                      'The GEE app additionally contains JavaScript-specific model materialization, direct/paged browser downloads, '
                      'fixed-10 m grid tiling, dynamic north arrow/scale bar, and UI controls; those presentation/download mechanisms '
                      'are intentionally not duplicated in Python.\n'
                  )
                  cell['source'] = text.splitlines(keepends=True)
                  break
          nb_path.write_text(json.dumps(nb, indent=1, ensure_ascii=False) + '\n', encoding='utf-8')

          # --- README: align public inputs, expanded output workflow, and version note. ---
          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = readme.replace(
              'A reproducible Google Earth Engine workflow for guided automated land-cover mapping in Libya, with the default area of interest set to Fezzan.',
              'A reproducible Google Earth Engine and Python workflow for guided automated land-cover mapping in Libya, developed around a Fezzan case study while accepting user-supplied AOI and training assets.'
          )
          readme = readme.replace(
              'The default AOI and training collections are personal Earth Engine assets. They are **external dependencies and are not bundled with this repository**. Users without access must provide replacement assets with the expected geometry and class field.',
              'For portability, the public GEE application intentionally starts with blank AOI and training-asset fields. Users paste accessible Earth Engine asset IDs at run time. The Python configuration retains author-specific example asset IDs as convenience defaults; those assets are **external dependencies and are not bundled with this repository**, so other users must provide equivalent replacements.'
          )
          old_output = (
              'The JavaScript application displays the selected map and creates a single-band UInt8 GeoTIFF export task to Google Drive in `LandCover_Exports`. '
              'The Python engine includes a matching Drive-export helper. The output class domain is **1–12**.'
          )
          new_output = (
              'The expanded JavaScript application displays the selected map, materializes the selected Random Forests as fixed decision-tree ensembles for reliable downloads, and generates direct GeoTIFF browser-download links. '
              'It supports full-map and tiled downloads, fixed-10 m row/column grids, paged link generation, automatic skipping of empty/outside-AOI cells, and dynamic map symbols. '
              'The Python engine mirrors the scientific/modeling core and provides an optional Google Drive export helper; JavaScript-specific browser-download/UI mechanics are intentionally not duplicated. The output class domain is **1–12**.'
          )
          if old_output in readme:
              readme = readme.replace(old_output, new_output, 1)
          readme = readme.replace(
              'The Python engine and Colab notebook are synchronized with the complete GEE modeling core. They use the same datasets, year bounds/defaults, class scheme, Random Forest settings, seed-selection criterion, validation logic, and temporal cultivated-class rules. GEE-specific user-interface and direct browser-download controls are intentionally not duplicated in Python.',
              'The Python engine and Colab notebook are synchronized with the expanded GEE **modeling core**. They use the same datasets, 2017–2024 year bounds, 2024/2023 target-fallback defaults, class scheme, Random Forest settings, seed-selection criterion, validation logic, and temporal cultivated-class rules. GEE-specific model materialization for browser downloads, fixed-10 m grid tiling, paged links, dynamic map symbols, and other UI controls are intentionally JavaScript-only.'
          )
          readme = readme.replace(
              'The public repository reproduces the computational logic, but the default personal Earth Engine AOI and training assets are external dependencies. Full reproduction therefore requires access to those assets or equivalent replacements.',
              'The public repository reproduces the computational logic. The GEE app accepts user-supplied AOI/training asset IDs, while the Python configuration includes author-specific example defaults; the underlying AOI/training assets remain external dependencies. Full reproduction therefore requires accessible equivalent assets.'
          )
          readme = readme.replace(
              'Software citation metadata are provided in `CITATION.cff`. The DOI for `v1.0.2` will be added after Zenodo archives this synchronized release.',
              'Software citation metadata are provided in `CITATION.cff`. The DOI for `v1.0.3` will be added after Zenodo archives this expanded synchronized release.'
          )
          readme_path.write_text(readme, encoding='utf-8')

          # --- Citation metadata. ---
          cff_path = Path('CITATION.cff')
          cff = cff_path.read_text(encoding='utf-8')
          if 'version: 1.0.2' not in cff:
              raise SystemExit('Expected CITATION.cff version 1.0.2 before v1.0.3 update.')
          cff = cff.replace('version: 1.0.2', 'version: 1.0.3', 1)
          cff_path.write_text(cff, encoding='utf-8')

          # --- Static tests: preserve the user's newly added GEE capabilities. ---
          test_path = Path('tests/test_repository_structure.py')
          tests = test_path.read_text(encoding='utf-8')
          marker = 'def test_notebook_is_valid_json_and_uses_safe_dynamic_import():'
          expanded_test = '''def test_expanded_gee_features_are_preserved():\n    js = (ROOT / "gee/automated_land_cover_app.js").read_text(encoding="utf-8")\n    for token in (\n        "MATERIALIZE THE SELECTED RANDOM FOREST MODELS",\n        "DIRECT GEOTIFF DOWNLOADS FOR A PUBLISHED EARTH ENGINE APP",\n        "DYNAMIC NORTH ARROW AND SCALE BAR",\n        "SIMPLE ROWS / COLUMNS DOWNLOADS - FIXED 10 m PIXELS",\n        "getDownloadURL",\n    ):\n        assert token in js\n    assert "'Area of interest FeatureCollection asset',\\n  ''" in js\n    assert "'Training points FeatureCollection asset',\\n  ''" in js\n\n\n'''
          if 'def test_expanded_gee_features_are_preserved():' not in tests:
              if marker not in tests:
                  raise SystemExit('Could not locate test insertion point.')
              tests = tests.replace(marker, expanded_test + marker, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Verify synchronized expanded repository
        shell: bash
        run: |
          python -m pip install pytest
          node --check gee/automated_land_cover_app.js
          python -m py_compile python/landcover_engine.py python/01_test_gee_connection.py
          python -m json.tool python/02_landcover_colab.ipynb >/dev/null
          test "$(wc -c < gee/automated_land_cover_app.js)" -gt 100000
          python -m pytest -q

      - name: Create clean v1.0.3 commit
        id: clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/publish-v103-sync.yml
          git add -A
          git commit -m 'Synchronize expanded GEE application for v1.0.3'
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish v1.0.3
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_SHA: ${{ steps.clean.outputs.sha }}
        shell: bash
        run: |
          gh release create v1.0.3 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CLEAN_SHA" \
            --title "v1.0.3 — Expanded GEE workflow synchronized" \
            --notes "Preserves the latest expanded user-maintained GEE workflow, including model materialization, direct and tiled browser downloads, fixed-10 m grid handling, and dynamic map symbols. Restores independent personal-project branding and current 2017–2024 Satellite Embedding bounds, and re-verifies synchronization with the Python modeling core, Colab notebook, README, citation metadata, and static tests."
