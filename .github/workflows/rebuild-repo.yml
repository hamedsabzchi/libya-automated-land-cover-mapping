name: Rebuild repository

on:
  push:
    paths:
      - '.github/workflows/rebuild-repo.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild project files
        shell: bash
        run: |
          cat .source/repo.part00 .source/repo.part01 .source/repo.part02 .source/repo.part03 .source/repo.part04 .source/repo.part05 .source/repo.part06 > /tmp/repo.b64
          base64 -d /tmp/repo.b64 > /tmp/repo.tgz
          tar -xzf /tmp/repo.tgz
          rm -rf .source
          rm -f .github/workflows/rebuild-repo.yml
      - name: Verify rebuilt project
        shell: bash
        run: |
          node --check gee/automated_land_cover_app.js
          python -m pip install -q pytest
          python -m pytest -q
      - name: Commit clean project
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish automated land-cover mapping project'
          git push
