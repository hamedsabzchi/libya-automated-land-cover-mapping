name: Installable runner tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install wheel into a fresh environment
        run: |
          python -m venv /tmp/wp04-wheel
          /tmp/wp04-wheel/bin/pip install dist/*.whl
      - name: Exercise installed commands outside the source checkout
        working-directory: /tmp
        run: |
          /tmp/wp04-wheel/bin/libya-landcover --version
          /tmp/wp04-wheel/bin/libya-landcover jobs --store /tmp/wp05-jobs list
          /tmp/wp04-wheel/bin/libya-landcover validate "$GITHUB_WORKSPACE/contracts/examples/request.json"
          /tmp/wp04-wheel/bin/libya-landcover prepare-reference --reference "$GITHUB_WORKSPACE/gee/automated_land_cover_app.js" --output /tmp/reference-session.js
          node --check /tmp/reference-session.js
      - name: Verify orchestration and offline EE graphs
        run: /tmp/wp04-wheel/bin/python -m unittest discover -s tests -p 'test_*.py' -v
