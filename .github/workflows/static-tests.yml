name: Static tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Check Python syntax
        run: python -m py_compile python/landcover_engine.py python/01_test_gee_connection.py
      - name: Check notebook JSON
        run: python -c "import json; json.load(open('python/02_landcover_colab.ipynb', encoding='utf-8'))"
      - name: Check Earth Engine JavaScript syntax
        run: node --check gee/automated_land_cover_app.js
      - name: Run static repository tests
        run: python -m pytest -q
