name: Assistant contract tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate contracts and their integration boundaries
        run: python -m unittest discover -s tests -p 'test_contracts.py' -v
      - name: Validate the documented exchange
        run: python -m contracts exchange contracts/examples/request.json contracts/examples/status-completed.json contracts/examples/result.json
