name: Clean and verify project

on:
  push:
    paths:
      - '.github/workflows/cleanup-project.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary transfer files
        run: |
          rm -rf .source .stage .transfer2 .transfer3
          rm -f .github/workflows/rebuild-repo.yml
          rm -f .github/workflows/finalize-project.yml
          rm -f .github/workflows/cleanup-project.yml
      - name: Verify final repository
        run: |
          node --check gee/automated_land_cover_app.js
          python -m py_compile python/landcover_engine.py python/01_test_gee_connection.py
          python -c "import json; json.load(open('python/02_landcover_colab.ipynb', encoding='utf-8'))"
          python -m pip install -q pytest
          python -m pytest -q
      - name: Commit clean repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Clean temporary transfer files and finalize project'
          git push
