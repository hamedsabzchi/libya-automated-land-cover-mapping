name: Publish v1.0.0

on:
  push:
    paths:
      - '.github/workflows/publish-v1.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release candidate
        shell: bash
        run: |
          python -m pip install pytest
          node --check gee/automated_land_cover_app.js
          python -m pytest -q
          python -m json.tool python/02_landcover_colab.ipynb >/dev/null

      - name: Create clean release commit
        id: clean
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/publish-v1.yml
          git add -A
          git commit -m 'Prepare clean v1.0.0 release'
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          CLEAN_SHA: ${{ steps.clean.outputs.sha }}
        shell: bash
        run: |
          gh release create v1.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$CLEAN_SHA" \
            --title "v1.0.0" \
            --notes "Initial public release of the Libya Automated Land-Cover Mapping workflow, including the Google Earth Engine reference implementation, Python Earth Engine engine, Colab notebook, citation metadata, and automated tests."
